name: Translate PDF to Chinese

on:
  push:
    paths:
      - 'input/**'
      - '.github/workflows/translate_pdf.yml'
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  translate:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install pdf2zh and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pdf2zh
      
      - name: Create directories
        run: |
          mkdir -p input output
      
      - name: Translate PDFs in input folder
        run: |
          if [ -d "input" ] && [ "$(ls -A input/*.pdf 2>/dev/null)" ]; then
            echo "Found PDF files in input folder, starting translation..."
            for pdf_file in input/*.pdf; do
              if [ -f "$pdf_file" ]; then
                filename=$(basename "$pdf_file")
                echo "Translating: $filename"
                pdf2zh "$pdf_file" -o output/ -e google || echo "Warning: Failed to translate $filename"
              fi
            done
            echo "Translation complete"
          else
            echo "No PDF files found in input folder"
          fi
      
      - name: Generate index.html
        run: |
          python generate_index.py
      
      - name: List output files
        run: |
          echo "Output directory contents:"
          ls -lah output/
      
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './output'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
